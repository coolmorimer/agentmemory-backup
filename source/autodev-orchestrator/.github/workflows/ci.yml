name: CI

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install uv
      - run: uv sync --all-groups --locked
      - run: uv run ruff check .
      - run: uv run mypy apps/api/autodev
      - run: uv run pytest

